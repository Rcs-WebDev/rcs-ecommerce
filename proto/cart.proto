syntax = "proto3";

package pb;

option go_package = "./pb";

service CartService {
    rpc GetCart (GetCartRequest) returns (CartResponse);
    rpc AddToCart (AddToCartRequest) returns (CartResponse);
    rpc UpdateCartItem (UpdateCartItemRequest) returns (CartResponse);
    rpc RemoveFromCart (RemoveFromCartRequest) returns (CartResponse);
    rpc ClearCart (ClearCartRequest) returns (ClearCartResponse);
}

message CartItem {
    int64 id = 1;
    int64 product_id = 2;
    string product_name = 3;
    double product_price = 4;
    string product_image = 5;
    int32 quantity = 6;
}

message GetCartRequest {
    int64 user_id = 1;
}

message AddToCartRequest {
    int64 user_id = 2;
    int64 product_id = 3;
    int32 quantity = 4;
}

message UpdateCartItemRequest {
    int64 user_id = 1;
    int64 product_id = 2;
    int32 quantity = 3;
}

message RemoveFromCartRequest {
    int64 user_id = 1;
    int64 product_id = 2;
}

message ClearCartRequest {
    int64 user_id = 1;
}

message CartResponse {
    repeated CartItem items = 1;
    double total_price = 2;
}

message ClearCartResponse {
    string message = 1;
}
